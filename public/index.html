<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hanzi — imparare il cinese</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700&family=Noto+Serif+SC:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <h1 class="logo"><span lang="zh">汉字</span> Hanzi</h1>
    <nav class="tabs" role="tablist" aria-label="Sezioni">
      <button class="tab is-active" role="tab" data-tab="writing" aria-selected="true">Scrittura</button>
      <button class="tab" role="tab" data-tab="pronunciation" aria-selected="false">Pronuncia</button>
      <button class="tab" role="tab" data-tab="flashcards" aria-selected="false">Flashcards</button>
    </nav>
  </header>

  <main>
   <!-- SCRITTURA (Écriture) -->
    <section id="writing" class="panel is-active" role="tabpanel">
      <div class="writing-layout">
        
        <div class="board-wrap">
          <!-- Sélecteur de mode -->
          <div class="btn-row center" style="margin-bottom: 20px;">
            <button id="w-mode-scroll" class="btn primary">Scorrimento (Liste)</button>
            <button id="w-mode-train" class="btn">Allenamento (Boucle)</button>
          </div>
          
          <!-- Mini animateur qui tourne en boucle -->
          <div id="w-mini-animator" style="width: 80px; height: 80px; margin: 0 auto 15px auto; background: var(--card-bg); border: 2px solid var(--border-soft); border-radius: 16px; position: relative;"></div>
          
          <div id="writer" class="board" aria-label="Area di tracciatura"></div>
          <p id="writing-msg" class="msg">Scegli un carattere e traccia i tratti.</p>
        </div>
        
        <div class="side">
          <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 16px;">
            <p class="big-info" style="margin: 0;"><span id="w-pinyin" class="pinyin"></span> <span id="w-meaning"></span></p>
            <button id="w-listen" class="btn primary" style="border-radius: 50%; width: 46px; height: 46px; padding: 0; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; margin: 0; box-shadow: 0 4px 0 var(--primary-dark);" title="Ascolta la pronuncia">🔊</button>
          </div>
          
          <div class="btn-row">
            <button id="w-quiz" class="btn primary">Traccio</button>
            <button id="w-animate" class="btn">Vedi l'ordine</button>
            <button id="w-clear" class="btn">Ricomincia</button>
          </div>
          
          <h2 class="small-title">Navigazione</h2>
          <div class="search-wrap" style="display: flex; gap: 8px; margin-bottom: 15px;">
            <button id="w-btn-list" class="btn" style="flex: 1; padding: 12px 10px;">☰ Griglia</button>
            <input type="text" id="w-search" placeholder="Parola in italiano o Hanzi..." style="flex: 2; padding: 12px; border-radius: 16px; border: 2px solid var(--border-soft); font-family: var(--sans); font-size: 1rem; outline: none;">
            <button id="w-btn-search" class="btn primary">Traccia</button>
          </div>
          
          <div id="full-char-list" class="char-list" style="display: none; max-height: 250px; overflow-y: auto; padding: 12px; border: 2px solid var(--border-soft); border-radius: 16px; background: var(--card-bg); margin-bottom: 15px;"></div>
        </div>
        
      </div>
    </section>

    <!-- PRONONCIATION -->
    <section id="pronunciation" class="panel" role="tabpanel" hidden>
      <div class="pron">
        <h2 class="small-title">Allenamento vocale</h2>
        
        <!-- Nouvelle barre pour taper la phrase -->
        <div class="search-wrap" style="display: flex; gap: 8px; margin-bottom: 30px; justify-content: center; max-width: 500px; margin-left: auto; margin-right: auto;">
          <input type="text" id="p-input" placeholder="Scrivi una frase in italiano..." style="flex: 1; padding: 14px; border-radius: 16px; border: 2px solid var(--border-soft); font-family: var(--sans); font-size: 1.1rem; outline: none;">
          <button id="p-btn-translate" class="btn primary">Traduci</button>
        </div>

        <div id="p-hanzi" class="hanzi-big" lang="zh" style="font-size: clamp(2.5rem, 8vw, 4rem);"></div>
        <p id="p-pinyin" class="pinyin big"></p>
        <p id="p-meaning" class="meaning" style="margin-bottom: 24px;"></p>
        
        <!-- Boutons d'action -->
        <div class="btn-row center" style="margin-top: 10px; align-items: center;">
          <button id="p-listen" class="btn" style="border-radius: 50%; width: 54px; height: 54px; padding: 0; font-size: 1.5rem;" title="Ascolta il modello">🔊</button>
          <button id="p-record" class="btn primary" style="border-radius: 24px; padding: 14px 32px; font-size: 1.2rem; min-width: 180px;">🎤 Parlo</button>
        </div>
        
        <p id="p-result" class="msg" aria-live="polite" style="font-size: 1.1rem; margin-top: 16px;"></p>
        <p class="hint">Consiglio: se sbagli, ascolta bene il modello e riprova!</p>
      </div>
    </section>

    <!-- FLASHCARDS -->
    <section id="flashcards" class="panel" role="tabpanel" hidden>
      <div class="fc">
        <div class="fc-toolbar">
          <button id="fc-open-form" class="btn primary">Crea una flashcard</button>
          <button id="fc-open-list" class="btn" type="button">Le mie carte</button>
          <span id="fc-stats" class="msg"></span>
        </div>
 
        <p id="fc-empty" class="msg" hidden>Ancora nessuna carta: crea la tua prima flashcard.</p>
 
        <article id="fc-card" class="fc-card" hidden>
          <p id="fc-type" class="fc-type"></p>
 
          <!-- Recto -->
          <div id="fc-front">
            <div class="fc-question">
              <div id="fc-q-main" class="q-main"></div>
              <div id="fc-q-sub" class="q-sub"></div>
            </div>
            <input id="fc-input" class="fc-input" type="text" autocomplete="off" placeholder="Scrivi il significato in italiano" hidden>
            <div id="fc-draw" hidden>
              <div class="grid-box"><canvas id="fc-canvas" aria-label="Area di disegno"></canvas></div>
              <button id="fc-clear" class="btn" type="button">Cancella</button>
            </div>
            <div class="btn-row center">
              <button id="fc-check" class="btn primary" type="button"></button>
            </div>
          </div>
 
          <!-- Verso : comparaison faite par l'utilisateur -->
          <div id="fc-back" hidden>
            <div id="fc-compare" class="compare">
              <div id="fc-mine" class="compare-col">
                <h3>La tua risposta</h3>
                <p id="fc-mine-text" class="mine-text"></p>
                <div id="fc-mine-img-wrap" class="grid-box"><img id="fc-mine-img" alt="Il tuo tracciato"></div>
              </div>
              <div class="compare-col">
                <h3>Soluzione</h3>
                <div id="fc-sol-zh" class="sol-zh" lang="zh"></div>
                <p id="fc-sol-py" class="pinyin big"></p>
                <p id="fc-sol-fr" class="meaning"></p>
                <button id="fc-listen" class="btn" type="button">Ascolta</button>
              </div>
            </div>
            <p id="fc-help" class="msg"></p>
            <div class="btn-row center">
              <button id="fc-no" class="btn" type="button">Ho sbagliato</button>
              <button id="fc-yes" class="btn primary" type="button">Ho indovinato</button>
            </div>
          </div>
        </article>
 
        <dialog id="fc-list-dialog" class="dialog dialog-wide">
          <h2 id="fc-list-title">Le mie flashcard</h2>
          <ul id="fc-list" class="card-list"></ul>
          <div class="btn-row">
            <button id="fc-list-close" class="btn" type="button">Chiudi</button>
          </div>
        </dialog>
 
        <dialog id="fc-dialog" class="dialog">
          <form id="fc-form">
            <h2>Nuova flashcard</h2>
            <label class="field">Parola in italiano
              <input id="fc-add-fr" type="text" autocomplete="off">
            </label>
            <label class="field">Cinese
              <input id="fc-add-zh" type="text" lang="zh" autocomplete="off">
            </label>
            <label class="field">Pinyin
              <input id="fc-add-py" type="text" autocomplete="off">
            </label>
            <p id="fc-form-msg" class="msg" aria-live="polite"></p>
            <div class="btn-row">
              <button id="fc-cancel" class="btn" type="button">Annulla</button>
              <button id="fc-create" class="btn primary" type="submit">Crea la carta</button>
            </div>
          </form>
        </dialog>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3.5.0/dist/hanzi-writer.min.js"></script>
  <script src="js/vocab.js"></script>
  <script src="js/pinyin-pro.js"></script>
  <script src="js/writing.js"></script>
  <script src="js/pronunciation.js"></script>
  <script src="js/flashcards.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
